<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Mitovski Coaching</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        padding: 2rem;
        gap: 0.75rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        font-size: 1rem;
        color: #a3a3a3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're offline.</h1>
      <p>Please reconnect to submit your check-in.</p>
    </div>
  </body>
</html>
